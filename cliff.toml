[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}{% if commit.breaking %} [BREAKING]{% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# ee2427e changed --json from a bare events array to an object keyed by
# stream, but its subject has no `!`. History is published, so flag it here.
commit_preprocessors = [
  { pattern = '^feat\(render\): add the usage report with', replace = "feat(render)!: add the usage report with" },
]

commit_parsers = [
  # GitHub merge commits carry the PR title plus "(#N)", which duplicates the
  # branch commit underneath. Earlier merges were titled "merge: ..." and fell
  # out on their own; this catches the ones that weren't.
  { message = '\(#\d+\)$', skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
]

filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"
