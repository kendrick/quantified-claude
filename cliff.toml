[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message }}{% if commit.breaking %} [BREAKING]{% endif %}\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

# ee2427e changed --json from a bare events array to an object keyed by
# stream, but its subject has no `!`. History is published, so flag it here.
commit_preprocessors = [
  { pattern = '^feat\(render\): add the usage report with', replace = "feat(render)!: add the usage report with" },
]

commit_parsers = [
  # PRs #13–#16 and #18 landed as merge commits titled like the branch commits
  # under them, so skip those five to list each change once. PRs squash-merge
  # from here on; add the SHA here if one slips through as a merge commit.
  { sha = "1d0c0f0b869da5873b437df20d21b1cf21e6b70c", skip = true },
  { sha = "a3fb23b43340cd21643400caf9a9454a504261bc", skip = true },
  { sha = "26a3c701669eaf5124f33ff3b20415ac6fb115b5", skip = true },
  { sha = "8beec1d932c8334a3772e1f0a1124b737f24e20b", skip = true },
  { sha = "fd23cd15f7f67b256f91fe836539438448fef9a1", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
]

filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"
